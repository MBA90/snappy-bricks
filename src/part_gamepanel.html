<div class="gamepanel" id="gamePanel" hidden>
        <div class="gp-target" id="gTarget"></div>
        <div class="gp-main">
          <div class="gp-head">
            <h2 id="gTitle"></h2>
            <span class="gp-stars" id="gStars"></span>
          </div>
          <p class="gp-text" id="gText"></p>
          <div class="gp-bar" aria-hidden="true"><span id="gBarFill"></span></div>
          <p class="gp-prog" id="gProg" aria-live="polite"></p>
          <div class="gp-letters" id="gLetters"></div>
          <div class="gp-actions">
            <button class="btn white small" id="gHint" type="button" data-i18n="hint">Hint</button>
            <button class="btn white small" id="gReset" type="button" data-i18n="startOver">Start over</button>
            <button class="btn lav small" id="gLevels" type="button" data-i18n="levels">Levels</button>
            <button class="btn white small" id="gAlpha" type="button">ABC</button>
            <button class="btn mint small" id="gNext" type="button"><span data-i18n="next">Next</span> <span class="arr" aria-hidden="true">➜</span></button>
          </div>
        </div>
      </div>
